  - SOURCE_REPOSITORY_AUTHORITY_AS_UNIVERSAL_BRAIN_AUTHORITY
  - HUMAN_HEMISPHERIC_OR_LOBAR_PACKAGING
  - SOURCE_PRODUCT_HARDWARE_REQUIREMENT_AS_UNIVERSAL_HC_REQUIREMENT

cross_cutting_separations:
  - OBSERVATION_NE_INTERPRETATION
  - MEASURED_NE_DERIVED_NE_INFERRED
  - SALIENCE_NE_TRUTH
  - STORED_NE_CURRENT
  - ROUTED_NE_INCORPORATED
  - DELIVERED_NE_BELIEVED
  - PRIORITY_NE_AUTHORITY
  - DESIRE_NE_BELIEF
  - DESIRE_NE_CONSENT
  - INTENTION_NE_AUTHORIZATION
  - CAPABILITY_NE_PERMISSION
  - ACTION_SELECTED_NE_ACTION_AUTHORIZED
  - PRESENTATION_NE_IDENTITY
  - SELF_MODEL_NE_WHOLE_MIND

