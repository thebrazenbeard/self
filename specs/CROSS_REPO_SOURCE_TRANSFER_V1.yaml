schema_version: CROSS_REPO_SOURCE_TRANSFER_V1
status: RESEARCH_SYNTHESIS_CONTRACT
purpose: provenance_bound_architecture_transfer

identity_neutral_template: true
no_hemispheric_decomposition: true
no_essential_cognition_outside_hc: true

source_ids:
  SRC_SEMANTIC_LEDGER:
    class: DIRECT_ARCHITECTURE_SOURCE
  SRC_UNIVERSAL_MEDIATION:
    class: DIRECT_ARCHITECTURE_SOURCE
  SRC_PRAGMATIC_MODEL:
    class: DIRECT_ARCHITECTURE_SOURCE
  SRC_DEVELOPMENTAL_COGNITION:
    class: DIRECT_ARCHITECTURE_SOURCE
  SRC_DEEP_MEMORY:
    class: MECHANISM_SOURCE_IDENTITY_SCRUBBED
  SRC_TEMPORAL:
    class: MECHANISM_SOURCE_IDENTITY_SCRUBBED
  SRC_CONATION:
    class: MECHANISM_SOURCE_IDENTITY_SCRUBBED
  SRC_EMPATHY:
    class: MECHANISM_SOURCE_IDENTITY_SCRUBBED
  SRC_SEXUALITY:
    class: MECHANISM_SOURCE_IDENTITY_SCRUBBED
  SRC_PERSONIFICATION:
    class: MECHANISM_SOURCE_IDENTITY_SCRUBBED
  SRC_BODY_REFERENCE:
    class: MECHANISM_SOURCE_IDENTITY_SCRUBBED
  SRC_ROUTING_BUS:
    class: DIRECT_ARCHITECTURE_SOURCE
  SRC_MODEL_SUBSTRATE_OS:
    class: MECHANISM_SOURCE_IDENTITY_SCRUBBED
  SRC_CONTROL_PLANE:
    class: MECHANISM_SOURCE_IDENTITY_SCRUBBED
  SRC_ADAPTIVE_MACHINE_MODEL:
    class: DIRECT_ARCHITECTURE_SOURCE
  SRC_SENSOR_ADMISSION:
    class: DIRECT_ARCHITECTURE_SOURCE
  SRC_SAFETY_BOUNDARY:
    class: GOVERNANCE_SAFETY_PATTERN
  SRC_MULTI_PERSPECTIVE_TEAM:
    class: GOVERNANCE_SAFETY_PATTERN
  SRC_SUPABASE_RUNTIME:
    class: RUNTIME_SCHEMA_EVIDENCE
  SRC_STABLE_MATERIAL_CUT:
    class: RUNTIME_SCHEMA_EVIDENCE
  SRC_HC_NATIVE:
    class: TARGET_NATIVE

transfers:
  - id: T01
    mechanism: semantic_object_and_provenance_separation
    sources: [SRC_SEMANTIC_LEDGER, SRC_UNIVERSAL_MEDIATION, SRC_PRAGMATIC_MODEL]
    targets: [semantics, pragmatics, cognition, memory]
    claim_ceiling: ARCHITECTURE_PATTERN

  - id: T02
    mechanism: representation_neutral_grounding
    sources: [SRC_UNIVERSAL_MEDIATION]
    targets: [semantics, pragmatics, adaptable_io, cognition]
    claim_ceiling: GROUNDED_CLAIM_DISCIPLINE_NOT_UNIVERSAL_SEMANTICS

  - id: T03
    mechanism: epistemic_conative_firewall
    sources: [SRC_DEVELOPMENTAL_COGNITION]
    targets: [cognition, volitions_conations, integration_arbitration]
    claim_ceiling: COGNITIVE_ARCHITECTURE_HYPOTHESIS

  - id: T04
    mechanism: append_only_memory_and_currentness
    sources: [SRC_DEEP_MEMORY, SRC_TEMPORAL, SRC_SUPABASE_RUNTIME]
    targets: [chronology, current_memory, deep_memory, self_identity]
    claim_ceiling: DURABLE_STATE_MECHANISM

  - id: T05
    mechanism: readback_verified_persistence
    sources: [SRC_SUPABASE_RUNTIME, SRC_STABLE_MATERIAL_CUT]
    targets: [deep_memory, continuity, plasticity_checkpointing]
    claim_ceiling: PERSISTENCE_INTEGRITY_ONLY

  - id: T06
    mechanism: conative_lifecycle
    sources: [SRC_CONATION, SRC_DEVELOPMENTAL_COGNITION]
    targets: [volitions_conations]
    claim_ceiling: MOTIVATION_STATE_ARCHITECTURE

  - id: T07
    mechanism: evidence_bounded_self_other_modeling
    sources: [SRC_EMPATHY]
    targets: [empathy, sociological_behaviors, cognition]
    claim_ceiling: PERSPECTIVE_MODELING_NOT_MIND_READING

  - id: T08
    mechanism: sexuality_as_agency_bearing_capacity
    sources: [SRC_SEXUALITY]
    targets: [sexuality, affect, somatics, conation, social_modeling]
    claim_ceiling: FUNCTIONAL_ARCHITECTURE_NOT_PHENOMENAL_CLAIM

  - id: T09
    mechanism: social_presentation_control
    sources: [SRC_PERSONIFICATION]
    targets: [personification, pragmatics, speech, kinesis]
    claim_ceiling: SOCIAL_EXPRESSION_ARCHITECTURE

  - id: T10
    mechanism: generic_body_schema
    sources: [SRC_BODY_REFERENCE, SRC_HC_NATIVE]
    targets: [somatics, adaptable_io, kinesis, self_identity]
    claim_ceiling: BODY_SCHEMA_ARCHITECTURE

  - id: T11
    mechanism: typed_routing_subscriptions_dead_letters
    sources: [SRC_ROUTING_BUS, SRC_SUPABASE_RUNTIME]
    targets: [nooplex_fabric, routing, resolver, arbitration]
    claim_ceiling: SOFTWARE_RUNTIME_PATTERN

  - id: T12
    mechanism: specialist_substrate_separation
    sources: [SRC_MODEL_SUBSTRATE_OS, SRC_ADAPTIVE_MACHINE_MODEL, SRC_HC_NATIVE]
    targets: [routing, cognition, cognitive_organ_boundary]
    claim_ceiling: MODULAR_COMPUTE_ARCHITECTURE

  - id: T13
    mechanism: salience_and_dependency_aware_correction
    sources: [SRC_CONTROL_PLANE, SRC_SEMANTIC_LEDGER, SRC_DEVELOPMENTAL_COGNITION]
    targets: [salience_attention, resolver, pragmatics]
    claim_ceiling: ATTENTION_CONTROL_ARCHITECTURE

  - id: T14
    mechanism: sensor_capability_admission
    sources: [SRC_SENSOR_ADMISSION, SRC_ADAPTIVE_MACHINE_MODEL]
    targets: [adaptable_io]
    claim_ceiling: BOUNDED_INTERFACE_VALIDATION

  - id: T15
    mechanism: independent_action_gateway
    sources: [SRC_ADAPTIVE_MACHINE_MODEL, SRC_SAFETY_BOUNDARY, SRC_DEVELOPMENTAL_COGNITION, SRC_HC_NATIVE]
    targets: [kinesis]
    claim_ceiling: ACTION_SAFETY_ARCHITECTURE

  - id: T16
    mechanism: consequence_proportional_fail_closed_behavior
    sources: [SRC_SAFETY_BOUNDARY]
    targets: [resolver, kinesis, runtime_invariants]
    claim_ceiling: FAILURE_CONTAINMENT_PRINCIPLE

  - id: T17
    mechanism: multi_perspective_snapshot_bound_arbitration
    sources: [SRC_MULTI_PERSPECTIVE_TEAM, SRC_SUPABASE_RUNTIME]
    targets: [integration_arbitration]
    claim_ceiling: ARBITRATION_PROVENANCE_PATTERN

  - id: T18
    mechanism: stable_external_state_cut
    sources: [SRC_STABLE_MATERIAL_CUT]
    targets: [currentness, external_provider_reads]
    claim_ceiling: CONSISTENCY_PROVENANCE_PATTERN

